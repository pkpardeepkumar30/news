name: Collect news
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/scrape.py
      - run: python scripts/prepare_bundle.py
      - name: Commit collected data
        run: |
          git config user.name "nazar-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/inbox data/chatgpt-input
          git diff --cached --quiet || git commit -m "Collect news batch"
          git push
